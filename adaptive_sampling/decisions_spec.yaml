file:
  version: 0.1
  columns:
    - name: read_id
      description: "A unique UUID for the sequenced read."
      regex: "[a-f0-9]{8}-[a-f0-9]{4}-[4-5][a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}" # accepts uuid4 and uuid5
      examples:
        - e4994c62-93f9-439a-bc8f-d20c95a137a5
    - name: action
      description: "Adaptive sampling action taken for this read."
      regex: "sequence|unblock"
      examples:
        - "sequence"
        - "unblock"
    - name: action_response
      description: "MinKNOW's response to the action."
      regex: "SUCCESS|FAILED_READ_FINISHED|FAILED_READ_TOO_LONG"
      examples:
        - "SUCCESS"
