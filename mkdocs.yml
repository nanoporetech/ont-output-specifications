site_name: Oxford Nanopore Output Specifications
site_url: !ENV READTHEDOCS_CANONICAL_URL

# Adds the Github Link at top right
repo_url: https://github.com/nanoporetech/ont-output-specifications
repo_name: Oxford Nanopore Output Specifications

nav:
  - index.md
  - Read Formats:
    - BAM: read_formats/bam.md
    - FASTQ: read_formats/fastq.md
    - POD5: read_formats/pod5.md
    - .fast5 (deprecated): read_formats/fast5.md
  - Sequencing Summary: protocol_formats/sequencing_summary.md
  - Sample Sheet: protocol_formats/sample_sheet.md
  - Output Hash File: protocol_formats/output_hash_file.md
  - MinKNOW:
    - Output Structure: minknow/output_structure.md
    - Format Support: minknow/support.md
    - Patterns: minknow/patterns.md
    - Batching: minknow/batching.md
    - Adaptive Sampling:
      - AS Decisions: minknow/adaptive_sampling/adaptive_sampling_decisions.md
      - AS Timings: minknow/adaptive_sampling/adaptive_sampling_timings.md

copyright: "© 2020 - 2025 Oxford Nanopore Technologies plc. All rights reserved. Registered Office: Gosling Building, Edmund Halley Road, Oxford Science Park, OX4 4DQ, UK | Registered No. 05386273 | VAT No 336942382. Oxford Nanopore Technologies, the Wheel icon, EPI2ME, Flongle, GridION, Metrichor, MinION, MinIT, MinKNOW, Plongle, PromethION, SmidgION, Ubik and VolTRAX are registered trademarks of Oxford Nanopore Technologies plc in various countries. Oxford Nanopore Technologies products are not intended for use for health assessment or to diagnose, treat, mitigate, cure, or prevent any disease or condition."

theme:
  name: material
  font: false
  features:
    - navigation.instant # Do not fully reload pages
    - navigation.sections # Show docs groups as sections instead of nesting as tree
    - navigation.top # Back to top button
    - navigation.indexes # Makes the index of a section a page

    - search.suggest
    - search.highlight
    - search.share

    - content.tabs.link
    - content.code.annotate
    - content.code.copy
  language: en
  logo: extra/assets/nanopore.logo.png
  favicon: extra/assets/favicon.ico
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      scheme: ont
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      scheme: ont
      # scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      # primary: cyan
      # accent: blue

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: ont-dark
      # scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      # primary: deep purple
      # accent: blue
  custom_dir: docs/extra

  # 404 page
  static_templates:
    - 404.html

plugins:
  - search
  - macros:
      verbose: false # Set to true to debug the `find` function
  - mike:
      # These fields are all optional; the defaults are as below...
      alias_type: symlink
      redirect_template: null
      deploy_prefix: ''
      canonical_version: null
      version_selector: true
      css_dir: css
      javascript_dir: js

markdown_extensions:
  - bam_field_docs
  - fastq_field_docs
  - csv_spec_docs
  - pattern_docs
  - admonition # Add nice Note, Warning, Error areas
  - toc:
      permalink: true
      title: On this page

extra:
  specification:
    git_url: https://github.com/nanoporetech/ont-output-specifications
  version:
    provider: mike


extra_css:
  - extra/stylesheets/extra.css
